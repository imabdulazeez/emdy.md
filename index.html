            "@type": "WebApplication",
            "@id": "https://emdy.md/#app",
            "url": "https://emdy.md/",
            "name": "emdy.md",
            "description": "A free, fast, private Markdown editor that runs entirely in your browser. Documents stay on your device as plain .md files.",
            "applicationCategory": "BusinessApplication",
            "applicationSubCategory": "Markdown editor",
            "operatingSystem": "Any",
            "browserRequirements": "Requires JavaScript and a browser with the Origin Private File System.",
            "isAccessibleForFree": true,
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
            "featureList": [
              "Editable live preview and raw Markdown modes",

              "Keyboard shortcuts for every action",

    <script>
      (function () {
        function read(key) {
          try {
            return JSON.parse(localStorage.getItem(key));
          } catch (error) {
            return null;
          }
        }
        var root = document.documentElement;
        var stored = read("emdy:pref:theme");
        var theme =
          stored === "dark" || stored === "light"
            ? stored
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        root.setAttribute("data-no-transitions", "");
        root.dataset.theme = theme;
        root.style.colorScheme = theme;
        var font = read("emdy:pref:font");
        root.dataset.font =
          font === "serif" || font === "mono" || font === "handwriting" ? font : "sans";
        var builtIn = "__EMDY_THEMES__";
        var id = read("emdy:pref:palette");
        var custom = read("emdy:pref:custom-themes");
        var palette = typeof builtIn === "object" && builtIn[id];
        if (!palette && Array.isArray(custom)) {
          for (var i = 0; i < custom.length; i++) {
            if (custom[i] && custom[i].id === id) palette = custom[i];
          }
        }
        var colors = palette && palette[theme];
        if (!colors || typeof colors !== "object") return;
        for (var role in colors) {
          if (/^#[0-9a-f]{6}$/.test(colors[role])) {
            root.style.setProperty("--color-" + role, colors[role]);
          }
        }
      })();
    </script>

  <body>
    <div id="app"></div>
    <noscript>

          margin: 4rem auto;

        <h1>emdy.md: a private Markdown editor that runs in your browser</h1>
        <p>
          emdy.md is a free, fast Markdown editor that keeps everything on your device. Your
          documents are plain <code>.md</code> files in your browser's own storage. There is no
          account, nothing is uploaded, and there is no tracking of any kind.
        </p>
        <ul>
          <li>Write in raw Markdown or an editable live preview.</li>
          <li>Navigate long documents with an outline, and link documents to each other.</li>
          <li>Choose light, dark, or custom colour themes and a document font.</li>
          <li>Export to Markdown, Word (.docx), or PDF, and move your library with one file.</li>
          <li>Reach every action from the keyboard.</li>
        </ul>
        <p>emdy.md needs JavaScript. Turn it on and reload the page to start writing.</p>
      </main>
    </noscript>
    <script type="module" src="/src/index.tsx"></script>
