name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The `prepare` script runs `vp config`, which would otherwise install the
  # Git hook dispatcher into the CI checkout. CI never commits, so skip it.
  VP_GIT_HOOKS: "0"

jobs:
  check:
    name: Check and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Read pnpm version
        id: pnpm
        run: echo "version=$(jq -r '.devEngines.packageManager.version' package.json)" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.pnpm.outputs.version }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format, lint and type check
        run: pnpm exec vp check

      - name: Unit and component tests
        run: pnpm exec vp test

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Read pnpm version
        id: pnpm
        run: echo "version=$(jq -r '.devEngines.packageManager.version' package.json)" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.pnpm.outputs.version }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # playwright.config.ts builds the app and serves a preview on
      # 127.0.0.1:4173; with CI set it enables forbidOnly and two workers.
      - name: Playwright
        run: pnpm test:browser
        env:
          CI: "true"

      - name: Upload traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
