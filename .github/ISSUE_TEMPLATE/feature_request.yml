name: Feature request
description: Propose a change before writing code for it.
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        emdy.md runs entirely on the device. Ideas that need a server or a network request will not be accepted.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How should it work, including from the keyboard?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to open a pull request for this.
